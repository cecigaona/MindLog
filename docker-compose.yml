services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mindlog_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mindlog_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DATABASE_URL: ecto://postgres:postgres@db:5432/mindlog_dev
      TEST_DATABASE_URL: ecto://postgres:postgres@db:5432/mindlog_test
      PHX_BIND_ADDRESS: 0.0.0.0
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
